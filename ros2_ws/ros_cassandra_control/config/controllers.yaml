controller_manager:
  ros__parameters:
    update_rate: 30
#     use_sim_time: true

    diff_controller:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

diff_controller:
  ros__parameters:
    publish_rate: 30.0
    base_frame_id: base_link

    left_wheel_names:
      - joint_front_left_wheel
      - joint_rear_left_wheel

    right_wheel_names:
      - joint_front_right_wheel
      - joint_rear_right_wheel

    wheel_separation: 0.297
    wheel_radius: 0.03

    use_stamped_vel: false
    open_loop: false
    position_feedback: true
    cmd_vel_timeout: 0.5

    # wheels_per_side: x
    # wheel_separation_multiplier: x
    # left_wheel_radius_multiplier: x
    # right_wheel_radius_multiplier: x

    # odom_frame_id: x
    # pose_covariance_diagonal: x
    # twist_covariance_diagonal: x
    # enable_odom_tf: x

    publish_limited_velocity: true
    # velocity_rolling_window_size: x


    linear.x.has_velocity_limits: true
    # linear.x.has_acceleration_limits: false
    # linear.x.has_jerk_limits: false
    linear.x.max_velocity: 3.0
    linear.x.min_velocity: -3.0
    # linear.x.max_acceleration: NAN
    # linear.x.min_acceleration: NAN
    # linear.x.max_jerk: NAN
    # linear.x.min_jerk: NAN

    angular.z.has_velocity_limits: true
    # angular.z.has_acceleration_limits: false
    # angular.z.has_jerk_limits: false
    angular.z.max_velocity: 3.0
    angular.z.min_velocity: -3.0
    # angular.z.max_acceleration: NAN
    # angular.z.min_acceleration: NAN
    # angular.z.max_jerk: NAN
    # angular.z.min_jerk: NAN

joint_broad:
  ros__parameters:
    # Servo positions come from the physical servo driver on /joint_states.
    # This broadcaster publishes only wheel states to avoid duplicate,
    # instantaneous servo positions from GenericSystem.
    joints:
      - joint_front_left_wheel
      - joint_rear_left_wheel
      - joint_front_right_wheel
      - joint_rear_right_wheel
    interfaces:
      - position
      - velocity

forward_position_controller:
  ros__parameters:
    joints:
      - right_shoulder_joint
      - left_shoulder_joint
      - right_shoulder_low_joint
      - left_shoulder_low_joint
      - right_bicep_joint
      - left_bicep_joint
      - left_arm_joint
      - right_arm_joint
      - upper_torso_joint
      - head_yaw_joint
      - head_pitch_joint
      - left_claw_joint
      - right_claw_joint
    interface_name: position
